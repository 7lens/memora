[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "1.4.1"
description = "Durable context and shared Markdown knowledge for agents."
authors = [{name = "Devidfirz", email = "Devidfirz@7lens.io"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml==0.19.1", "markdown-it-py==4.2.0", "tomlkit==0.15.1"]

[project.optional-dependencies]
remote = ["rfc8785==0.1.4"]
mcp = ["mcp==1.30.0"]
test = ["rfc8785==0.1.4", "mcp==1.30.0", "pytest==9.1.1", "ruff==0.16.10"]
semantic = ["sentence-transformers==5.7.0"]

[project.scripts]
memora = "memora.cli:main"

[tool.setuptools.package-data]
memora = ["viewer.html", "protocol.md", "knowledge.schema.json", "knowledge.remote.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scale: Tests with 10000 entities"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLW1510", "RUF059"]
